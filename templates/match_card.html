<div class="bg-slate-900/90 border border-slate-800/80 hover:border-emerald-500/40 transition-all duration-300 rounded-2xl p-5 shadow-2xl flex flex-col justify-between relative overflow-hidden group">
    <div class="absolute -top-24 -right-24 w-48 h-48 bg-emerald-500/10 rounded-full blur-3xl group-hover:bg-emerald-500/20 transition-all pointer-events-none"></div>

    <div>
        <!-- Cabecera del partido (Hora y Estadio) -->
        <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-800/80 text-xs">
            <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-slate-800/80 text-slate-300 font-medium border border-slate-700/50 shadow-sm">
                🕒 {{ match.time }}
            </span>
            <span class="text-slate-400 truncate max-w-[180px]">🏟️ {{ match.stadium }}</span>
        </div>

        <!-- Tarjetas de Equipos (Equipos y Pitchers) -->
        <div class="grid grid-cols-1 gap-3">
            <!-- Visitante -->
            <div class="flex items-center justify-between p-3 rounded-xl bg-slate-950/50 border border-slate-800/60 shadow-inner">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-slate-800 to-slate-900 border border-slate-700/80 flex items-center justify-center font-black text-xs text-emerald-400 shadow-sm">
                        {{ match.away[:3].upper() }}
                    </div>
                    <div>
                        <span class="text-[10px] text-slate-500 uppercase tracking-wider font-bold block">Visitante (Away)</span>
                        <span class="font-bold text-sm block text-slate-100 tracking-tight">{{ match.away }}</span>
                    </div>
                </div>
                <div class="text-right">
                    <span class="text-[10px] text-slate-500 uppercase tracking-wider block">Pitcher Abridor</span>
                    <span class="text-xs font-semibold text-slate-300">{{ match.starter_away }}</span>
                </div>
            </div>

            <!-- Local -->
            <div class="flex items-center justify-between p-3 rounded-xl bg-slate-950/50 border border-slate-800/60 shadow-inner">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-slate-800 to-slate-900 border border-slate-700/80 flex items-center justify-center font-black text-xs text-blue-400 shadow-sm">
                        {{ match.home[:3].upper() }}
                    </div>
                    <div>
                        <span class="text-[10px] text-slate-500 uppercase tracking-wider font-bold block">Local (Home)</span>
                        <span class="font-bold text-sm block text-slate-100 tracking-tight">{{ match.home }}</span>
                    </div>
                </div>
                <div class="text-right">
                    <span class="text-[10px] text-slate-500 uppercase tracking-wider block">Pitcher Abridor</span>
                    <span class="text-xs font-semibold text-slate-300">{{ match.starter_home }}</span>
                </div>
            </div>
        </div>
    </div>
</div>
