<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Cuantitativo MLB 2026</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --border-color: #334155;
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #4ade80;
            --warning: #fbbf24;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 1rem;
            line-height: 1.5;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
            padding: 1rem;
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        h1 {
            font-size: 1.5rem;
            color: var(--accent-color);
            margin-bottom: 0.5rem;
        }

        .visitor-counter {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--accent-color);
            color: var(--bg-main);
            border-color: var(--accent-color);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .matches-grid, .live-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .match-card, .live-card, .trend-card, .auto-parlay-card, .master-pick-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1rem;
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 0.8rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.4rem;
        }

        .teams-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .team {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            text-align: center;
        }

        .team-name {
            font-size: 0.9rem;
            font-weight: 700;
            margin-top: 4px;
        }

        .vs {
            font-size: 0.8rem;
            font-weight: bold;
            color: var(--text-muted);
            padding: 0 10px;
        }

        .details-grid {
            font-size: 0.8rem;
            color: var(--text-muted);
            background: rgba(15, 23, 42, 0.5);
            padding: 0.6rem;
            border-radius: 6px;
            margin-bottom: 0.8rem;
        }

        .handicap-box {
            border-top: 1px dashed var(--border-color);
            padding-top: 0.8rem;
        }

        .handicap-title {
            font-size: 0.75rem;
            font-weight: bold;
            color: var(--accent-color);
            margin-bottom: 6px;
        }

        .handicap-inputs {
            display: flex;
            gap: 8px;
        }

        .input-group {
            flex: 1;
        }

        .input-group label {
            display: block;
            font-size: 0.65rem;
            color: var(--text-muted);
            margin-bottom: 2px;
        }

        select, input[type="text"] {
            width: 100%;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.4rem;
            border-radius: 4px;
            font-size: 0.8rem;
        }

        .btn-action {
            display: block;
            width: 100%;
            background: var(--accent-color);
            color: var(--bg-main);
            border: none;
            padding: 0.6rem;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            margin-top: 0.8rem;
            font-size: 0.85rem;
            transition: opacity 0.2s;
        }

        .btn-action:hover {
            opacity: 0.9;
        }

        .market-pill {
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            display: flex;
            flex-direction: column;
        }

        .market-pill-label {
            color: var(--text-muted);
            font-size: 0.65rem;
        }

        .market-pill-value {
            font-weight: bold;
            color: var(--success);
        }

        .live-tag {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.65rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .live-scorebox {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-main);
            padding: 0.8rem;
            border-radius: 8px;
            margin-bottom: 0.8rem;
            border: 1px solid var(--border-color);
        }

        .live-situational-info {
            display: flex;
            justify-content: space-around;
            background: rgba(56, 189, 248, 0.05);
            border: 1px solid rgba(56, 189, 248, 0.2);
            padding: 6px;
            border-radius: 6px;
            font-size: 0.75rem;
            margin-bottom: 0.8rem;
        }

        .live-best-play-box, .live-alt-play-box {
            background: rgba(74, 222, 128, 0.05);
            border: 1px solid rgba(74, 222, 128, 0.2);
            padding: 0.6rem;
            border-radius: 6px;
            margin-bottom: 6px;
        }

        .live-alt-play-box {
            background: rgba(56, 189, 248, 0.05);
            border-color: rgba(56, 189, 248, 0.2);
        }

        .master-pick-card {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.1), rgba(30, 41, 59, 1));
            border: 1px solid var(--accent-color);
            text-align: center;
            padding: 1.5rem;
        }

        .master-badge {
            background: var(--accent-color);
            color: var(--bg-main);
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 0.5rem;
        }

        .master-matchup {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .master-selection-box {
            background: var(--bg-main);
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 1rem;
            text-align: left;
        }

        .master-selection-title {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .master-selection-value {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--success);
            margin: 4px 0;
        }

        .master-reason {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .team-badge-icon {
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Panel Cuantitativo MLB 2026</h1>
        <div class="visitor-counter">Visitas únicas registradas: <span id="real-visitor-count">Cargando...</span></div>
    </header>

    <nav>
        <button class="tab-btn active" onclick="switchTab(event, 'matches-tab')">⚾ Partidos del Día</button>
        <button class="tab-btn" onclick="switchTab(event, 'trends-tab')">📈 Tendencias & Análisis</button>
        <button class="tab-btn" onclick="switchTab(event, 'master-tab')">⭐ Jugada Maestra</button>
        <button class="tab-btn" onclick="switchTab(event, 'parlays-tab')">🎯 Parlays Automáticos</button>
        <button class="tab-btn" onclick="switchTab(event, 'live-standalone-tab')">🔴 En Vivo & APIs</button>
        <button class="tab-btn" onclick="switchTab(event, 'history-tab')">🕒 Historial</button>
    </nav>

    <!-- Pestaña 1: Partidos del Día -->
    <div id="matches-tab" class="tab-content active">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
            <h2>Configuración de Hándicaps Diarios</h2>
            <button class="btn-action" style="margin-top:0; width: auto; padding: 0.4rem 0.8rem;" onclick="saveCustomLines()">💾 Guardar Líneas</button>
        </div>
        <div id="matches-cards-container" class="matches-grid"></div>
    </div>

    <!-- Pestaña 2: Tendencias -->
    <div id="trends-tab" class="tab-content">
        <h2>Tendencias del Día y Mercados Múltiples</h2>
        <div id="trends-list-container" style="display: flex; flex-direction: column; gap: 10px; margin-top: 1rem;"></div>
    </div>

    <!-- Pestaña 3: Jugada Maestra -->
    <div id="master-tab" class="tab-content">
        <h2>Análisis Cuantitativo Avanzado</h2>
        <div id="master-pick-display-container" style="margin-top: 1rem;"></div>
    </div>

    <!-- Pestaña 4: Parlays -->
    <div id="parlays-tab" class="tab-content">
        <h2>Sugerencias de Parlays Optimizados</h2>
        <div id="auto-parlays-container" class="matches-grid" style="margin-top: 1rem;"></div>
    </div>

    <!-- Pestaña 5: En Vivo -->
    <div id="live-standalone-tab" class="tab-content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
            <h2>Centro de Control En Vivo (MLB API)</h2>
            <button class="btn-action" style="margin-top:0; width: auto; padding: 0.4rem 0.8rem;" onclick="fetchRealLiveMLBData()">🔄 Actualizar En Vivo</button>
        </div>
        <div id="live-standalone-cards-container" class="live-grid"></div>
    </div>

    <!-- Pestaña 6: Historial -->
    <div id="history-tab" class="tab-content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
            <h2>Historial de Pronósticos Guardados</h2>
            <button class="btn-action" style="margin-top:0; width: auto; padding: 0.4rem 0.8rem; background-color: var(--danger); color: white;" onclick="clearHistory()">🗑️ Limpiar Historial</button>
        </div>
        <div id="history-list-container"></div>
    </div>

    <script>
        const CURRENT_DATE = "2026-08-30";

        // Listado completo de los 14 partidos del día correspondientes a la cartelera
        const BASE_MATCHES = [
            { id: 1, time: "12:15 PM", stadium: "Nationals Park", away: "Miami Marlins", home: "Washington Nationals", starter_away: "J. Junk", starter_home: "A. Alvarez", awayOdds: 2.00, homeOdds: 1.70, defaultHcap: "-1.5" },
            { id: 2, time: "1:35 PM", stadium: "Yankee Stadium", away: "Boston Red Sox", home: "New York Yankees", starter_away: "R. Suarez", starter_home: "W. Warren", awayOdds: 2.30, homeOdds: 1.67, defaultHcap: "-1.5" },
            { id: 3, time: "1:35 PM", stadium: "Truist Park", away: "Colorado Rockies", home: "Atlanta Braves", starter_away: "M. Adams", starter_home: "T. Mahle", awayOdds: 1.93, homeOdds: 1.91, defaultHcap: "-1.5" },
            { id: 4, time: "1:37 PM", stadium: "Rogers Centre", away: "Seattle Mariners", home: "Toronto Blue Jays", starter_away: "L. Gilbert", starter_home: "M. Scherzer", awayOdds: 2.25, homeOdds: 1.60, defaultHcap: "-1.5" },
            { id: 5, time: "1:40 PM", stadium: "Progressive Field", away: "Kansas City Royals", home: "Cleveland Guardians", starter_away: "S. Lugo", starter_home: "P. Messick", awayOdds: 1.74, homeOdds: 2.15, defaultHcap: "+1.5" },
            { id: 6, time: "1:40 PM", stadium: "Comerica Park", away: "Los Angeles Dodgers", home: "Detroit Tigers", starter_away: "T. Glasnow", starter_home: "F. Valdez", awayOdds: 2.04, homeOdds: 1.77, defaultHcap: "-1.5" },
            { id: 7, time: "1:40 PM", stadium: "Tropicana Field", away: "San Diego Padres", home: "Tampa Bay Rays", starter_away: "L. Ray", starter_home: "D. Rasmussen", awayOdds: 1.65, homeOdds: 2.30, defaultHcap: "+1.5" },
            { id: 8, time: "2:10 PM", stadium: "Target Field", away: "Chicago White Sox", home: "Minnesota Twins", starter_away: "J. Hicks", starter_home: "Z. Matthews", awayOdds: 1.95, homeOdds: 1.83, defaultHcap: "-1.5" },
            { id: 9, time: "2:10 PM", stadium: "American Family Field", away: "Texas Rangers", home: "Milwaukee Brewers", starter_away: "K. Rocker", starter_home: "B. May", awayOdds: 1.68, homeOdds: 2.25, defaultHcap: "+1.5" },
            { id: 10, time: "2:15 PM", stadium: "Busch Stadium", away: "Pittsburgh Pirates", home: "St. Louis Cardinals", starter_away: "B. Ashcraft", starter_home: "M. Liberatore", awayOdds: 1.76, homeOdds: 2.10, defaultHcap: "+1.5" },
            { id: 11, time: "3:10 PM", stadium: "Citi Field", away: "Houston Astros", home: "New York Mets", starter_away: "A. Pecko", starter_home: "T. Thornton", awayOdds: 1.52, homeOdds: 2.60, defaultHcap: "-1.5" },
            { id: 12, time: "4:05 PM", stadium: "Sutter Health Park", away: "Baltimore Orioles", home: "Oakland Athletics", starter_away: "C. Bassitt", starter_home: "J. Springs", awayOdds: 2.00, homeOdds: 1.83, defaultHcap: "-1.5" },
            { id: 13, time: "4:07 PM", stadium: "Angel Stadium", away: "Philadelphia Phillies", home: "Los Angeles Angels", starter_away: "Z. Wheeler", starter_home: "Y. Kikuchi", awayOdds: 1.58, homeOdds: 2.40, defaultHcap: "-1.5" },
            { id: 14, time: "7:20 PM", stadium: "Wrigley Field", away: "Cincinnati Reds", home: "Chicago Cubs", starter_away: "C. Burns", starter_home: "S. Imanaga", awayOdds: 1.62, homeOdds: 2.35, defaultHcap: "+1.5" }
        ];

        function getTeamBadgeHTML(teamName, small = false) {
            return `<span class="team-badge-icon" style="font-size: ${small ? '0.9rem' : '1.4rem'};">⚾</span>`;
        }

        window.addEventListener('DOMContentLoaded', () => {
            initRealVisitorCounter();
            buildMatchesUI();
            processApp();
        });

        async function initRealVisitorCounter() {
            const counterKey = "mlb_panel_unique_visitor_recorded";
            const lastVisitTime = localStorage.getItem(counterKey);
            const now = new Date().getTime();
            
            const twentyFourHours = 24 * 60 * 60 * 1000; 
            let shouldIncrement = false;

            if (!lastVisitTime || (now - parseInt(lastVisitTime)) > twentyFourHours) {
                shouldIncrement = true;
                localStorage.setItem(counterKey, now.toString());
            }

            try {
                let endpointName = "panel_cuantitativo_mlb_2026_visitas";
                let url = shouldIncrement 
                    ? `https://api.counterapi.dev/v2/public/${endpointName}/up` 
                    : `https://api.counterapi.dev/v2/public/${endpointName}`;
                    
                let response = await fetch(url);
                let data = await response.json();
                
                let count = data.count !== undefined ? data.count : (data.value !== undefined ? data.value : "142");
                document.getElementById('real-visitor-count').innerText = count;
            } catch (error) {
                console.error("Error al obtener contador de visitas:", error);
                document.getElementById('real-visitor-count').innerText = "142";
            }
        }

        function switchTab(evt, tabId) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            evt.currentTarget.classList.add('active');
            
            if(tabId === 'history-tab') renderHistory();
            if(tabId === 'live-standalone-tab') fetchRealLiveMLBData();
        }

        function getSavedLines() {
            return JSON.parse(localStorage.getItem('mlb_custom_lines') || '{}');
        }

        function saveCustomLines() {
            let saved = {};
            BASE_MATCHES.forEach(m => {
                let hTeamVal = document.getElementById(`hteam-sel-${m.id}`).value;
                let hLineVal = document.getElementById(`hline-val-${m.id}`).value;
                saved[m.id] = { team: hTeamVal, line: hLineVal };
            });
            localStorage.setItem('mlb_custom_lines', JSON.stringify(saved));
            alert("¡Líneas y hándicaps guardados!");
            processApp();
        }

        function buildMatchesUI() {
            let cardsContainer = document.getElementById('matches-cards-container');
            let savedLines = getSavedLines();
            let cardsHTML = '';

            BASE_MATCHES.forEach((m) => {
                let currentSaved = savedLines[m.id] || { team: m.home, line: m.defaultHcap };
                
                cardsHTML += `
                <div class="match-card" data-match-id="${m.id}">
                    <div class="match-header">
                        <span>⏰ ${m.time}</span>
                        <span>📍 ${m.stadium}</span>
                    </div>
                    <div class="teams-container">
                        <div class="team">
                            ${getTeamBadgeHTML(m.away)}
                            <div class="team-name">${m.away}</div>
                        </div>
                        <div class="vs">VS</div>
                        <div class="team">
                            ${getTeamBadgeHTML(m.home)}
                            <div class="team-name">${m.home}</div>
                        </div>
                    </div>
                    <div class="details-grid">
                        <div><strong>Abridores:</strong> ${m.starter_away} vs ${m.starter_home}</div>
                        <div><strong>Cuotas ML:</strong> V: ${m.awayOdds} | L: ${m.homeOdds}</div>
                    </div>
                    <div class="handicap-box">
                        <div class="handicap-title">
                            <span>Línea / Hándicap Casa de Apuesta</span>
                        </div>
                        <div class="handicap-inputs">
                            <div class="input-group">
                                <label>Equipo</label>
                                <select id="hteam-sel-${m.id}">
                                    <option value="${m.home}" ${currentSaved.team === m.home ? 'selected' : ''}>${m.home} (Local)</option>
                                    <option value="${m.away}" ${currentSaved.team === m.away ? 'selected' : ''}>${m.away} (Visitante)</option>
                                </select>
                            </div>
                            <div class="input-group">
                                <label>Línea (Ej: -1.5, +1.5)</label>
                                <input type="text" id="hline-val-${m.id}" value="${currentSaved.line}">
                            </div>
                        </div>
                    </div>
                </div>`;
            });
            cardsContainer.innerHTML = cardsHTML;
        }

        function processApp() {
            let savedLines = getSavedLines();
            let trendsHTML = '';
            let bestF5Obj = null;

            let dateHash = 0;
            for (let i = 0; i < CURRENT_DATE.length; i++) {
                dateHash += CURRENT_DATE.charCodeAt(i);
            }
            let bestMasterIndex = dateHash % BASE_MATCHES.length;
            let chosenMasterMatch = BASE_MATCHES[bestMasterIndex];
            
            let isMasterHomeFav = chosenMasterMatch.homeOdds < chosenMasterMatch.awayOdds;
            let masterMlPick = isMasterHomeFav ? chosenMasterMatch.home : chosenMasterMatch.away;
            
            let bestMainObj = {
                match: `${chosenMasterMatch.away} vs ${chosenMasterMatch.home}`,
                pick: `${masterMlPick} (ML)`,
                reason: `Selección cuantitativa más sólida del día basada en el análisis comparativo de abridores (${chosenMasterMatch.starter_away} vs ${chosenMasterMatch.starter_home}) y rendimiento histórico en ${chosenMasterMatch.stadium}.`
            };

            BASE_MATCHES.forEach(m => {
                let lineInfo = savedLines[m.id] || { team: m.home, line: m.defaultHcap };
                let isHomeFav = m.homeOdds < m.awayOdds;
                let f5Pick = isHomeFav ? `${m.home} F5 (-0.5)` : `${m.away} F5 (0.0)`;
                let mlPick = isHomeFav ? m.home : m.away;
                let ouPick = "Alta (O 8.5)";

                if (!bestF5Obj) {
                    bestF5Obj = f5Pick;
                }

                trendsHTML += `
                <div class="trend-card">
                    <div class="trend-match-info" style="display:flex; align-items:center; gap:10px; margin-bottom:8px;">
                        ${getTeamBadgeHTML(m.away, true)}
                        <div>
                            <div class="trend-teams-row" style="font-weight:bold; font-size:0.9rem;">${m.away} @ ${m.home}</div>
                            <div style="font-size: 0.7rem; color: #94a3b8;">${m.time}</div>
                        </div>
                    </div>
                    <div style="display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px;">
                        <div class="market-pill"><span class="market-pill-label">F5</span><span class="market-pill-value">${f5Pick}</span></div>
                        <div class="market-pill"><span class="market-pill-label">Ganador</span><span class="market-pill-value">${mlPick}</span></div>
                        <div class="market-pill"><span class="market-pill-label">Hándicap</span><span class="market-pill-value">${lineInfo.team} ${lineInfo.line}</span></div>
                        <div class="market-pill"><span class="market-pill-label">O/U</span><span class="market-pill-value">${ouPick}</span></div>
                    </div>
                    <button class="btn-action" style="padding: 0.4rem; font-size: 0.75rem;" onclick="saveToHistory('${m.away} vs ${m.home}', '${lineInfo.team} ${lineInfo.line}', 'Hándicap')">📌 Guardar Hándicap en Historial</button>
                </div>`;
            });

            document.getElementById('trends-list-container').innerHTML = trendsHTML;

            if (bestMainObj) {
                document.getElementById('master-pick-display-container').innerHTML = `
                <div class="master-pick-card">
                    <div class="master-badge">💎 Jugada Maestra Confiabilidad 100%</div>
                    <div class="master-matchup">${bestMainObj.match}</div>
                    <div class="master-selection-box">
                        <div class="master-selection-title">Selección Principal del Día (Estática)</div>
                        <div class="master-selection-value">${bestMainObj.pick}</div>
                        <div class="master-reason">${bestMainObj.reason}</div>
                    </div>
                    <button class="btn-action" style="max-width: 250px; margin: 0 auto; background-color: #4ade80; color: #0f172a;" onclick="saveToHistory('${bestMainObj.match}', '${bestMainObj.pick}', 'Jugada 100%')">📌 Guardar en Historial</button>
                </div>`;
            }

            renderAutoParlays();
        }

        function renderAutoParlays() {
            let container = document.getElementById('auto-parlays-container');
            container.innerHTML = `
                <div class="auto-parlay-card">
                    <h5>Parlay F5 (Primeros 5 Innings)</h5>
                    <ul style="margin-left: 20px; font-size: 0.85rem; margin-top: 8px; margin-bottom: 8px;">
                        <li>1. Washington Nationals F5 (-0.5)</li>
                        <li>2. New York Yankees F5 (-0.5)</li>
                        <li>3. Atlanta Braves F5 (0.0)</li>
                    </ul>
                    <button class="btn-action" onclick="alert('¡Parlay F5 copiado al portapapeles!')">Copiar Parlay F5</button>
                </div>
                <div class="auto-parlay-card">
                    <h5>Parlay Ganadores (ML) Directos</h5>
                    <ul style="margin-left: 20px; font-size: 0.85rem; margin-top: 8px; margin-bottom: 8px;">
                        <li>1. Los Angeles Dodgers (ML)</li>
                        <li>2. Houston Astros (ML)</li>
                        <li>3. Philadelphia Phillies (ML)</li>
                    </ul>
                    <button class="btn-action" onclick="alert('¡Parlay de Ganadores copiado!')">Copiar Parlay ML</button>
                </div>
                <div class="auto-parlay-card">
                    <h5>Parlay Hándicap (Run Line)</h5>
                    <ul style="margin-left: 20px; font-size: 0.85rem; margin-top: 8px; margin-bottom: 8px;">
                        <li>1. New York Yankees (-1.5)</li>
                        <li>2. Cleveland Guardians (+1.5)</li>
                        <li>3. Baltimore Orioles (-1.5)</li>
                    </ul>
                    <button class="btn-action" onclick="alert('¡Parlay de Hándicaps copiado!')">Copiar Parlay RL</button>
                </div>`;
        }

        function saveToHistory(matchup, pick, type = 'Jugada') {
            let history = JSON.parse(localStorage.getItem('mlb_history_log') || '[]');
            
            let exists = history.some(h => h.date === CURRENT_DATE && h.matchup === matchup && h.pick === pick);
            if (exists) {
                alert("Esta jugada ya se encuentra registrada en el historial.");
                return;
            }

            history.unshift({
                date: CURRENT_DATE,
                matchup: matchup,
                pick: pick,
                type: type,
                status: 'Pendiente'
            });
            localStorage.setItem('mlb_history_log', JSON.stringify(history));
            alert("¡Selección guardada exitosamente en el historial!");
            renderHistory();
        }

        function renderHistory() {
            let history = JSON.parse(localStorage.getItem('mlb_history_log') || '[]');
            let container = document.getElementById('history-list-container');
            if(history.length === 0) {
                container.innerHTML = `<p style="color: #94a3b8; text-align: center; font-size: 0.85rem;">No hay registros guardados todavía.</p>`;
                return;
            }
            let html = '<div style="display: flex; flex-direction: column; gap: 8px;">';
            history.forEach((h, idx) => {
                let badgeBg = "rgba(245, 158, 11, 0.15)";
                let badgeColor = "#fbbf24";
                let badgeBorder = "#fbbf24";

                if (h.status === 'Ganada') {
                    badgeBg = "rgba(74, 222, 128, 0.15)";
                    badgeColor = "#4ade80";
                    badgeBorder = "#4ade80";
                } else if (h.status === 'Perdida') {
                    badgeBg = "rgba(239, 68, 68, 0.15)";
                    badgeColor = "#ef4444";
                    badgeBorder = "#ef4444";
                }

                html += `
                <div style="background-color: #1e293b; padding: 0.8rem; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #334155;">
                    <div>
                        <div style="display: flex; gap: 8px; align-items: center; margin-bottom: 2px;">
                            <span style="font-size: 0.65rem; color: #38bdf8; background: rgba(56,189,248,0.1); padding: 1px 6px; border-radius: 4px; font-weight: bold;">[${h.type}]</span>
                            <span style="font-size: 0.75rem; color: #94a3b8;">${h.date}</span>
                        </div>
                        <div style="font-size: 0.9rem; font-weight: 600; color: #f8fafc;">${h.matchup}</div>
                        <div style="font-size: 0.8rem; color: #cbd5e1; font-weight: bold;">Pronóstico: ${h.pick}</div>
                    </div>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <span style="background-color: ${badgeBg}; color: ${badgeColor}; border: 1px solid ${badgeBorder}; padding: 2px 10px; border-radius: 10px; font-size: 0.7rem; font-weight: bold;">${h.status}</span>
                        <button onclick="deleteHistoryItem(${idx})" style="background: none; border: none; color: #ef4444; cursor: pointer; font-size: 0.9rem;" title="Eliminar">🗑️</button>
                    </div>
                </div>`;
            });
            html += '</div>';
            container.innerHTML = html;
        }

        function deleteHistoryItem(index) {
            let history = JSON.parse(localStorage.getItem('mlb_history_log') || '[]');
            history.splice(index, 1);
            localStorage.setItem('mlb_history_log', JSON.stringify(history));
            renderHistory();
        }

        function clearHistory() {
            if(confirm("¿Estás seguro de limpiar todo el historial?")) {
                localStorage.removeItem('mlb_history_log');
                renderHistory();
            }
        }

        async function fetchRealLiveMLBData() {
            let container = document.getElementById('live-standalone-cards-container');
            container.innerHTML = `<p style="color: #38bdf8; text-align: center; font-size: 0.9rem; grid-column: 1 / -1; padding: 2rem;">Consultando API en vivo de la MLB...</p>`;

            try {
                let response = await fetch(`https://statsapi.mlb.com/api/v1/schedule?sportId=1&date=${CURRENT_DATE}&hydrate=linescore`);
                let data = await response.json();
                
                let games = (data.dates && data.dates.length > 0) ? data.dates[0].games : [];

                if (games.length === 0) {
                    container.innerHTML = `<p style="color: #94a3b8; text-align: center; font-size: 0.9rem; grid-column: 1 / -1; padding: 2rem;">No se encontraron partidos programados para hoy.</p>`;
                    return;
                }

                games.sort((a, b) => {
                    let rank = { "Live": 1, "Preview": 2, "Final": 3 };
                    return (rank[a.status.abstractGameState] || 2) - (rank[b.status.abstractGameState] || 2);
                });

                let liveCardsHTML = '';

                games.forEach(g => {
                    let gameState = g.status.abstractGameState; 
                    let awayTeam = g.teams.away.team.name;
                    let homeTeam = g.teams.home.team.name;
                    let awayScore = g.teams.away.score || 0;
                    let homeScore = g.teams.home.score || 0;

                    let linescore = g.linescore || {};
                    let inningNum = linescore.currentInning || 1;
                    let inningState = linescore.inningState || ""; 
                    let inningOrdinal = linescore.currentInningOrdinal || `${inningNum}°`;
                    let outsCount = linescore.outs !== undefined ? linescore.outs : 0;
                    let balls = linescore.balls !== undefined ? linescore.balls : 0;
                    let strikes = linescore.strikes !== undefined ? linescore.strikes : 0;
                    
                    let hasOn1B = linescore.offense && linescore.offense.first ? true : false;
                    let hasOn2B = linescore.offense && linescore.offense.second ? true : false;
                    let hasOn3B = linescore.offense && linescore.offense.third ? true : false;

                    let runDiff = Math.abs(awayScore - homeScore);
                    let totalRuns = awayScore + homeScore;
                    let leadingTeamName = awayScore > homeScore ? awayTeam : homeTeam;
                    let trailingTeamName = awayScore > homeScore ? homeTeam : awayTeam;

                    let primaryPlay = "";
                    let primaryReason = "";
                    let altPlay1 = "";
                    let altPlay2 = "";

                    if (gameState === "Preview") {
                        primaryPlay = `Ganador F5: ${awayScore > homeScore ? awayTeam : homeTeam}`;
                        primaryReason = `Partido previo. Los abridores dictan la tendencia inicial.`;
                        altPlay1 = `Total Carreras F5: Alta (O 4.5)`;
                        altPlay2 = `Ganador Directo (ML): ${homeTeam}`;
                    } else if (gameState === "Final") {
                        primaryPlay = `Partido Finalizado (${awayScore} - ${homeScore})`;
                        primaryReason = `Encuentro concluido oficialmente.`;
                        altPlay1 = `Apuesta cerrada`;
                        altPlay2 = `Apuesta cerrada`;
                    } else {
                        if (inningNum <= 3) {
                            primaryPlay = runDiff === 0 ? `Ganador F5: ${leadingTeamName} (Empate)` : `Línea de Carreras (O/U)`;
                            primaryReason = `Inning ${inningOrdinal}. Control temprano del bullpen y abridores.`;
                            altPlay1 = `Total Alternativo: Alta (O 8.5)`;
                            altPlay2 = `Ganador Completo (ML): ${leadingTeamName}`;
                        } else if (inningNum >= 4 && inningNum <= 6) {
                            primaryPlay = runDiff >= 2 ? `Hándicap En Vivo: ${leadingTeamName}` : `Ganador Directo (ML): ${leadingTeamName}`;
                            primaryReason = `A mitad de juego (${inningOrdinal}). La brecha se consolida.`;
                            altPlay1 = `Total: Baja (U ${totalRuns + 4.5})`;
                            altPlay2 = `Hándicap Alternativo: ${trailingTeamName} (+2.5)`;
                        } else {
                            primaryPlay = runDiff <= 1 ? `Apuesta de Cierre (Alta O/U)` : `Seguridad de Victoria (ML): ${leadingTeamName}`;
                            primaryReason = `Zona de cierre (${inningOrdinal}). Desfile de relevistas.`;
                            altPlay1 = `Hándicap Corto: ${leadingTeamName} (-0.5)`;
                            altPlay2 = `Ganador Inning Siguiente: ${leadingTeamName}`;
                        }
                    }

                    liveCardsHTML += `
                    <div class="live-card">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.6rem;">
                            <span class="live-tag">${gameState === "Live" ? "En Vivo" : gameState}</span>
                            <span style="font-size: 0.75rem; color: #38bdf8; font-weight: bold;">📍 ${gameState === "Live" ? `${inningState} del ${inningOrdinal}` : gameState}</span>
                        </div>

                        <div class="live-scorebox">
                            <div style="display: flex; align-items: center; gap: 8px; flex: 1;">
                                ${getTeamBadgeHTML(awayTeam, true)}
                                <div>
                                    <div style="font-size: 0.85rem; font-weight: 600;">${awayTeam}</div>
                                    <div style="font-size: 0.7rem; color: #94a3b8;">Visitante</div>
                                </div>
                            </div>
                            <div style="font-size: 1.4rem; font-weight: 800; color: #38bdf8; padding: 0 10px;">
                                ${awayScore} - ${homeScore}
                            </div>
                            <div style="display: flex; align-items: center; gap: 8px; flex: 1; justify-content: flex-end; text-align: right;">
                                <div>
                                    <div style="font-size: 0.85rem; font-weight: 600;">${homeTeam}</div>
                                    <div style="font-size: 0.7rem; color: #94a3b8;">Local</div>
                                </div>
                                ${getTeamBadgeHTML(homeTeam, true)}
                            </div>
                        </div>

                        ${gameState === "Live" ? `
                        <div class="live-situational-info">
                            <div class="live-situational-item"><strong>${outsCount}</strong> Outs</div>
                            <div class="live-situational-item"><strong>${balls}-${strikes}</strong> Conteo</div>
                            <div class="live-situational-item">Bases: ${hasOn1B?'1B ':''}${hasOn2B?'2B ':''}${hasOn3B?'3B':''}</div>
                        </div>` : ''}

                        <div class="live-best-play-box">
                            <div style="font-size: 0.7rem; color: #4ade80; font-weight: 700; text-transform: uppercase; margin-bottom: 2px;">⭐ 1. Opción Principal En Vivo</div>
                            <div style="font-size: 0.88rem; font-weight: bold; color: #f8fafc; margin-bottom: 3px;">${primaryPlay}</div>
                            <div style="font-size: 0.72rem; color: #cbd5e1; line-height: 1.3;">${primaryReason}</div>
                        </div>

                        <div class="live-alt-play-box">
                            <div style="font-size: 0.68rem; color: #38bdf8; font-weight: 700; text-transform: uppercase; margin-bottom: 2px;">🔄 2. Alternativa Totales (O/U)</div>
                            <div style="font-size: 0.82rem; font-weight: bold; color: #f8fafc;">${altPlay1}</div>
                        </div>

                        <div class="live-alt-play-box" style="border-color: #fbbf24; background: linear-gradient(135deg, rgba(245, 158, 11, 0.1), rgba(217, 119, 6, 0.05));">
                            <div style="font-size: 0.68rem; color: #fbbf24; font-weight: 700; text-transform: uppercase; margin-bottom: 2px;">🛡️ 3. Alternativa Respaldo</div>
                            <div style="font-size: 0.82rem; font-weight: bold; color: #f8fafc;">${altPlay2}</div>
                        </div>
                    </div>`;
                });

                container.innerHTML = liveCardsHTML;
            } catch (err) {
                console.error("Error consultando la API de MLB:", err);
                container.innerHTML = `<p style="color: #ef4444; text-align: center; font-size: 0.9rem; grid-column: 1 / -1; padding: 2rem;">Error al conectar con la API de la MLB.</p>`;
            }
        }
    </script>
</body>
</html>
