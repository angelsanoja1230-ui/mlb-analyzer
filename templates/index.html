<!-- Sección Independiente de Partidos en Vivo -->
<div id="live-section-wrapper" class="mt-12 bg-slate-900/90 border border-emerald-500/30 rounded-3xl p-6 shadow-2xl backdrop-blur-xl">
    <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-4 mb-6 border-b border-slate-800 pb-4">
        <div>
            <h3 class="text-xl font-black text-emerald-400 flex items-center gap-2">
                <span class="w-3 h-3 rounded-full bg-emerald-500 animate-ping"></span> 
                Centro de Monitoreo en Vivo (Auto-refresh 30s)
            </h3>
            <p class="text-xs text-slate-400 mt-1">Actualización en tiempo real aislada del sistema principal.</p>
        </div>
        <div id="live-status-badge" class="text-xs font-bold px-3 py-1.5 rounded-xl bg-slate-950 border border-slate-800 text-emerald-400">
            Sincronizando...
        </div>
    </div>

    <!-- Contenedor dinámico alimentado por JavaScript cada 30 segundos -->
    <div id="live-games-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <!-- Los datos se inyectarán aquí de forma autónoma -->
        <div class="text-center py-8 text-slate-500 text-xs col-span-full">
            Cargando flujo en vivo...
        </div>
    </div>
</div>

<script>
    async function fetchLiveMatchesIndependent() {
        try {
            const response = await fetch('/api/live-matches');
            const data = await response.json();
            
            if (data.success) {
                const container = document.getElementById('live-games-container');
                const badge = document.getElementById('live-status-badge');
                badge.innerText = `Última actualización: ${data.timestamp}`;
                
                let htmlContent = '';
                data.matches.forEach(game => {
                    htmlContent += `
                        <div class="bg-slate-950/60 border border-slate-800/80 rounded-2xl p-4 flex flex-col justify-between gap-3 shadow-inner">
                            <div class="flex justify-between items-center text-xs">
                                <span class="font-bold text-emerald-400">🕒 ${game.time}</span>
                                <span class="text-slate-400 truncate max-w-[120px]">🏟️ ${game.stadium}</span>
                            </div>
                            <div class="space-y-2">
                                <div class="flex items-center justify-between bg-slate-900/60 p-2 rounded-xl border border-slate-800/50">
                                    <div class="flex items-center gap-2">
                                        <img src="${game.logo_away}" class="w-6 h-6 object-contain">
                                        <span class="text-xs font-bold text-slate-200">${game.away}</span>
                                    </div>
                                    <span class="text-xs font-bold text-slate-400">VIS</span>
                                </div>
                                <div class="flex items-center justify-between bg-slate-900/60 p-2 rounded-xl border border-slate-800/50">
                                    <div class="flex items-center gap-2">
                                        <img src="${game.logo_home}" class="w-6 h-6 object-contain">
                                        <span class="text-xs font-bold text-slate-200">${game.home}</span>
                                    </div>
                                    <span class="text-xs font-bold text-emerald-400">LOC</span>
                                </div>
                            </div>
                            <div class="border-t border-slate-800/80 pt-2 flex justify-between text-[11px]">
                                <span class="text-slate-400">Pronóstico: <strong class="text-emerald-400">${game.winner_full}</strong></span>
                                <span class="text-cyan-300 font-bold">${game.over_under.split('-')[0]}</span>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = htmlContent;
            }
        } catch (error) {
            console.error("Error al sincronizar datos en vivo:", error);
            document.getElementById('live-status-badge').innerText = "Error de sincronización";
        }
    }

    // Ejecutar inmediatamente al cargar y repetir cada 30 segundos (30000 ms)
    fetchLiveMatchesIndependent();
    setInterval(fetchLiveMatchesIndependent, 30000);
</script>
