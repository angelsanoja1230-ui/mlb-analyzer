    <!-- Bloque de anulación forzada a 3 columnas con máxima especificidad -->

    <style>

        body div#simulacion-container.matches-grid, 

        body div#matches-cards-container.matches-grid, 

        body div#auto-parlays-container.matches-grid,

        body .matches-grid {

            display: grid !important;

            grid-template-columns: repeat(3, minmax(0, 1fr)) !important;

            gap: 20px !important;

            width: 100% !important;

            max-width: 100% !important;

        }

        body div#simulacion-container.matches-grid > *, 

        body div#matches-cards-container.matches-grid > *, 

        body div#auto-parlays-container.matches-grid > *,

        body .matches-grid > * {

            width: 100% !important;

            max-width: 100% !important;

            min-width: 0 !important;

            box-sizing: border-box !important;

        }

    </style>

</head>
