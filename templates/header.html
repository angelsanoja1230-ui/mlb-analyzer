<header class="mb-10 text-center">
    <h1 class="text-4xl font-extrabold tracking-tight text-emerald-400 mb-2">🔮 El Oráculo de la MLB 2026</h1>
    <p class="text-slate-400 text-lg font-medium">
        📅 <span id="current-datetime" class="text-slate-200">Cargando fecha y hora...</span>
    </p>
</header>

<script>
    function updateDateTime() {
        const now = new Date();
        const options = { 
            weekday: 'long', 
            year: 'numeric', 
            month: 'long', 
            day: 'numeric', 
            hour: '2-digit', 
            minute: '2-digit', 
            second: '2-digit' 
        };
        let formatted = now.toLocaleDateString('es-ES', options);
        // Mayúscula inicial para el día de la semana
        formatted = formatted.charAt(0).toUpperCase() + formatted.slice(1);
        document.getElementById('current-datetime').textContent = formatted;
    }
    setInterval(updateDateTime, 1000);
    window.addEventListener('DOMContentLoaded', updateDateTime);
</script>
